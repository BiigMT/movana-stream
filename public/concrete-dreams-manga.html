<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Concrete Dreams Manga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: vertical manga reader. Ink-bordered panels stack on paper pages over a navy ground; under 640px each panel runs full width. */
:root{--ground:#0a0f1c;--ink:#0b1220;--paper:#e6ecf8;--blue:#2a6df4;--gold:#f5b800;--slate:#3b4a66;--mist:#aebbd6;--disp:'Bangers',Impact,sans-serif;--ltr:'Comic Neue','Comic Sans MS',sans-serif;--ui:'Poppins',system-ui,sans-serif;color-scheme:dark}
body{background:var(--ground);color:var(--mist);font-family:var(--ui);padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pg{width:min(100%,780px);margin:0 auto}
.page{background:var(--paper);padding:10px;display:flex;flex-direction:column;gap:7px;box-shadow:0 10px 40px #0008}
.row{display:flex;gap:7px;aspect-ratio:var(--ar)}
.panel{flex:var(--w) 1 0;min-width:0;position:relative;overflow:hidden;border:3px solid var(--ink);background:var(--ink);container-type:inline-size}
.panel svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.lbl{display:flex;justify-content:space-between;gap:12px;font:600 11px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;padding:10px 2px 26px;color:var(--mist)}
.b{position:absolute;box-sizing:border-box;font:700 clamp(10px,3.5cqw,17px)/1.22 var(--ltr);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:1.1em;padding:.45em .75em;text-align:center;z-index:3;text-wrap:balance}
.b.s::after,.b.sr::after{content:'';position:absolute;bottom:-.5em;width:.75em;height:.75em;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.b.s::after{left:22%}.b.sr::after{right:22%}
.b.v{background:#fff3c4;border-radius:0;text-align:left;font-style:italic}
.b.v::before{content:'V.O.';display:block;font:600 .6em var(--ui);letter-spacing:.16em;font-style:normal;color:#8a6500}
.b.ph{background:#dce7ff;border-style:dashed}
.b.ph::before{content:'PHONE';display:block;font:600 .58em var(--ui);letter-spacing:.16em;color:var(--slate)}
.b.x{background:none;border:0;padding:0;font:400 clamp(20px,9cqw,56px)/1 var(--disp);color:var(--gold);-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:.06em .06em 0 var(--ink);transform:rotate(-7deg);letter-spacing:.04em}
.cap{position:absolute;left:0;bottom:0;max-width:80%;background:var(--ink);color:var(--paper);font:600 clamp(9px,2.9cqw,13px)/1.3 var(--ui);padding:.5em .8em;z-index:3}
.tag{position:absolute;left:0;top:0;max-width:92%;background:var(--ink);color:var(--gold);font:600 clamp(8px,2.5cqw,11px)/1.3 var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:.55em .9em;z-index:4}
.tag small{display:block;color:var(--mist);font-weight:500;letter-spacing:.06em}
.phone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:88%;aspect-ratio:.56;background:#101a30;border:3px solid #c9d4ea;border-radius:12%/7%;padding:9% 7%;box-sizing:border-box;display:flex;flex-direction:column;gap:.6em;z-index:2;font:600 clamp(9px,3.1cqw,14px)/1.3 var(--ui);color:#e6ecf8;box-shadow:0 0 0 .3em var(--ink)}
.phone .who{font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.phone .msg{background:#1c2b4f;border-radius:.8em;padding:.6em .8em}
.phone .me{align-self:flex-end;background:var(--blue)}
.ttl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:.4em;z-index:2;padding:0 6%}
.ttl.low{place-content:end center;padding-bottom:5%}
.ttl b{font:400 clamp(30px,13cqw,100px)/.95 var(--disp);color:var(--blue);-webkit-text-stroke:.03em #0a1a40;text-shadow:.05em .05em 0 #0a1a40;letter-spacing:.03em}
.ttl i{font:600 clamp(10px,3cqw,16px)/1.3 var(--ui);letter-spacing:.22em;color:var(--gold);font-style:normal;text-transform:uppercase}
.ttl u{text-decoration:none;font:500 clamp(8px,2.3cqw,12px)/1.3 var(--ui);letter-spacing:.12em;color:var(--mist);text-transform:uppercase}
.top{position:absolute;top:0;left:0;right:0;text-align:center;font:600 clamp(8px,2.4cqw,12px) var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--paper);padding:.9em;z-index:3;background:linear-gradient(#0b1220cc,#0b122000)}
.foot{width:min(100%,780px);margin:8px auto 0;font:500 12px/1.6 var(--ui);color:var(--mist);text-align:center}
@media (max-width:640px){.row{flex-direction:column;aspect-ratio:auto}.panel{flex:none;width:100%;aspect-ratio:var(--par)}.page{padding:6px;gap:6px}}
</style>

<script id="reader-upgrade">
(function(){

  const focus=shell.querySelector('#focusToggle');focus.addEventListener('click',()=>{document.body.classList.toggle('focus-mode');focus.setAttribute('aria-pressed',String(document.body.classList.contains('focus-mode')));focus.textContent=document.body.classList.contains('focus-mode')?'Exit focus':'Focus'});
